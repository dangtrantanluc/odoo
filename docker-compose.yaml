
services:

  # ── Postgres (shared by API + agent audit) ───────────────────────────────
  bb_pm_db:
    image: postgres:16-alpine
    container_name: bb_pm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bbpm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bbpm_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-bb_pm}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - bb_pm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bbpm} -d ${POSTGRES_DB:-bb_pm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [bb_pm_net]

  # ── bb-pm API (Fastify + Prisma) ─────────────────────────────────────────
  bb_pm_api:
    build:
      context: ./bb-pm
      dockerfile: apps/api/Dockerfile
    container_name: bb_pm_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-bbpm}:${POSTGRES_PASSWORD:-bbpm_pwd}@bb_pm_db:5432/${POSTGRES_DB:-bb_pm}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:6080,http://127.0.0.1:6080,http://localhost:5173,http://127.0.0.1:5173}
      API_PORT: 4000
      AGENT_API_TOKEN: ${AGENT_API_TOKEN}
      AGENT_USER_EMAIL: ${AGENT_USER_EMAIL:-pm-agent@bluebolt.local}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-bb-pm-avatars}
    ports:
      - "${API_PORT:-4001}:4000"
    depends_on:
      bb_pm_db:
        condition: service_healthy
    networks: [bb_pm_net]

  # ── bb-pm Web (React SPA / nginx) ────────────────────────────────────────
  bb_pm_web:
    build:
      context: ./bb-pm
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api/v1}
    container_name: bb_pm_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-6080}:80"
    depends_on: [bb_pm_api]
    networks: [bb_pm_net]

  # ── OpenClaw gateway + PM Agent plugins ──────────────────────────────────
  openclaw:
    build:
      context: .
      dockerfile: docker/openclaw/Dockerfile
    container_name: openclaw
    restart: unless-stopped
    environment:
      # bb-pm-tools → bb-pm API
      BB_PM_API_URL: http://bb_pm_api:4000/api/v1
      BB_PM_AGENT_TOKEN: ${AGENT_API_TOKEN}

      # LLM (self-hosted Qwen by default; override to point at your endpoint)
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-nokey}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3.6-27B-FP8}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}

      # Gapo channel (gapo-work plugin)
      GAPO_API_URL: ${GAPO_API_URL:-https://api.gapowork.vn/3rd-bot/v1.0/3rd/messages}
      GAPO_BOT_TOKEN: ${GAPO_BOT_TOKEN:-}
      GAPO_SEND_TOKEN: ${GAPO_SEND_TOKEN}

      # Gateway
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}

      # Cron (disabled until targets are set)
      CRON_TZ: ${CRON_TZ:-Asia/Ho_Chi_Minh}
      CRON_DAILY_DIGEST: ${CRON_DAILY_DIGEST:-0 8 * * *}
      CRON_DAILY_DIGEST_TARGET: ${CRON_DAILY_DIGEST_TARGET:-}
      CRON_WEEKLY_HYGIENE: ${CRON_WEEKLY_HYGIENE:-0 9 * * MON}
      CRON_WEEKLY_HYGIENE_TARGET: ${CRON_WEEKLY_HYGIENE_TARGET:-}
    ports:
      - "${OPENCLAW_PORT:-18789}:18789"
    volumes:
      - openclaw_home:/root/.openclaw
    depends_on:
      bb_pm_api:
        condition: service_started
    networks: [bb_pm_net]
    extra_hosts:
      # Lets `host.docker.internal` resolve to the host so containers can
      # reach an LLM served outside the compose network (e.g. tailnet).
      - "host.docker.internal:host-gateway"

volumes:
  bb_pm_pgdata:
  openclaw_home:

networks:
  bb_pm_net:
    driver: bridge
