services:
  bb_pm_db:
    image: postgres:16-alpine
    container_name: bb_pm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bbpm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bbpm_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-bb_pm}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - bb_pm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bbpm} -d ${POSTGRES_DB:-bb_pm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pm_bb_pm_net

  bb_pm_redis:
    image: redis:7-alpine
    container_name: bb_pm_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - bb_pm_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - pm_bb_pm_net

  bb_pm_api:
    build:
      context: ./bb-pm
      dockerfile: apps/api/Dockerfile
    container_name: bb_pm_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-bbpm}:${POSTGRES_PASSWORD:-bbpm_pwd}@bb_pm_db:5432/${POSTGRES_DB:-bb_pm}
      JWT_SECRET: ${JWT_SECRET:-change-me-super-secret-64-chars-minimum-please-rotate}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      API_PORT: 4000
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
      AGENT_USER_EMAIL: ${AGENT_USER_EMAIL:-pm-agent@bluebolt.local}
      REDIS_URL: redis://bb_pm_redis:6379
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-bb-pm-avatars}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      bb_pm_db:
        condition: service_healthy
      bb_pm_redis:
        condition: service_healthy
    networks:
      - pm_bb_pm_net

  bb_pm_web:
    build:
      context: ./bb-pm
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:4000/api/v1}
    container_name: bb_pm_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - bb_pm_api
    networks:
      - pm_bb_pm_net

  openclaw:
    build:
      context: .
      dockerfile: docker/openclaw/Dockerfile
    container_name: openclaw
    restart: unless-stopped
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      BB_PM_API_URL: http://bb_pm_api:4000/api/v1
      BB_PM_AGENT_TOKEN: ${AGENT_API_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-default}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-nokey}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3.6-27B-FP8}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      NINE_ROUTER_BASE_URL: ${NINE_ROUTER_BASE_URL:-}
      NINE_ROUTER_API_KEY: ${NINE_ROUTER_API_KEY:-}
      NINE_ROUTER_MODEL: ${NINE_ROUTER_MODEL:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_MAX_TOKENS: ${GEMINI_MAX_TOKENS:-}
      GEMINI_TEMPERATURE: ${GEMINI_TEMPERATURE:-}
      GAPO_API_URL: ${GAPO_API_URL:-https://api.gapowork.vn/3rd-bot/v1.0/3rd/messages}
      GAPO_BOT_TOKEN: ${GAPO_BOT_TOKEN:-}
      GAPO_BOT_ID: ${GAPO_BOT_ID:-}
      GAPO_DRY_RUN: ${GAPO_DRY_RUN:-false}
      GAPO_SEND_TOKEN: ${GAPO_SEND_TOKEN:-}
      GAPO_SEND_URL: http://localhost:18789/api/plugins/gapo-agent/send
      BROWSER_TOOLS_TOKEN: ${BROWSER_TOOLS_TOKEN:-${GAPO_SEND_TOKEN:-}}
      BROWSER_TOOLS_SEND_URL: http://localhost:18789/api/plugins/browser-tools/send-dm
      BROWSER_TOOLS_FIND_URL: http://localhost:18789/api/plugins/browser-tools/find-user
      BROWSER_TOOLS_FIND_AND_OPEN_DM_URL: http://localhost:18789/api/plugins/browser-tools/find-and-open-dm
      GAPO_WORK_URL: ${GAPO_WORK_URL:-https://www.gapowork.vn}
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-1}
      BROWSER_MAX_DMS_PER_HOUR: ${BROWSER_MAX_DMS_PER_HOUR:-30}
      AGENT_WEBHOOK_URL: http://localhost:18789/api/plugins/bb-pm/agent/run
      AGENT_WEBHOOK_TIMEOUT_MS: ${AGENT_WEBHOOK_TIMEOUT_MS:-320000}
      BB_PM_PROMPT_VERSION: ${BB_PM_PROMPT_VERSION:-v2}
      REDIS_URL: redis://bb_pm_redis:6379
      CRON_TZ: ${CRON_TZ:-Asia/Ho_Chi_Minh}
      CRON_DAILY_DIGEST: ${CRON_DAILY_DIGEST:-0 8 * * *}
      CRON_DAILY_DIGEST_TARGET: ${CRON_DAILY_DIGEST_TARGET:-}
      CRON_WEEKLY_HYGIENE: ${CRON_WEEKLY_HYGIENE:-0 9 * * MON}
      CRON_WEEKLY_HYGIENE_TARGET: ${CRON_WEEKLY_HYGIENE_TARGET:-}
      CRON_CHECKIN_ENABLED: ${CRON_CHECKIN_ENABLED:-false}
      CRON_NOON_CHECKIN: ${CRON_NOON_CHECKIN:-50 11 * * 1-5}
      CRON_EOD_CHECKIN: ${CRON_EOD_CHECKIN:-50 17 * * 1-5}
      CRON_MISSING_CHECKIN_FOLLOWUP: ${CRON_MISSING_CHECKIN_FOLLOWUP:-0 18 * * 1-5}
      ADMIN_ALERT_TARGET: ${ADMIN_ALERT_TARGET:-}
    ports:
      - "${OPENCLAW_PORT:-18789}:18789"
    depends_on:
      bb_pm_api:
        condition: service_started
      bb_pm_redis:
        condition: service_healthy
    volumes:
      - openclaw_home:/root/.openclaw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pm_bb_pm_net

volumes:
  bb_pm_pgdata:
  bb_pm_redis_data:
  openclaw_home:

networks:
  pm_bb_pm_net:
    driver: bridge
